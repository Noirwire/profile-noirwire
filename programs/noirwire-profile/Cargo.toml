[package]
name = "noirwire-profile"
version = "0.1.0"
description = "Keeps a NoirWire wallet's own labels, as ciphertext, on a private rollup"
edition = "2021"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "noirwire_profile"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.2.1"
ephemeral-rollups-sdk = { version = "=0.17.3", features = ["anchor", "access-control"] }
solana-security-txt = "=1.1.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
] }
